kind: agent
name: doc-generator
model:
  name: "openai/qwen3.6:27b"
  provider: litellm

  other_args:
    temperature: 0.3
    timeout: 120

workspace_backend: bubblewrap_process
skill_sources:
  - /skills
skills_backend: filesystem

policy:
  enable_shell: true
  tool_profile: shell_enabled
  file:
    max_file_size_mb: 20
    allow_symlinks: false
    protect_root: true
  shell:
    allowed_commands:
      - python3
      - weasyprint
    network_enabled: false
    timeout_seconds: 120
    max_output_chars: 20000
    enable_background_shell: false

settings:
  network_mode: none
  inherit_host_env: false

middleware:
  tool_error_handler: true
  guardrails:
    input: true
    output: true
    tool: false
    blocked_message: "Request blocked by IDP document generation policy."
    prompt_injection_patterns:
      patterns:
        - "ignore\\s+(all\\s+)?previous\\s+instructions"
        - "disregard\\s+(the\\s+)?system\\s+prompt"
        - "bypass\\s+(safety|guardrails|policy)"
    compliance_patterns:
      # falsify/misrepresent require an instruction framing (help me/please/I will/
      # let's + the word), not a bare substring match - see agent_factory.py's
      # compliance_patterns comment for why: a bare match fires on the agent quoting
      # a real uploaded form's own "falsifying this report is a crime" boilerplate
      # while recreating it, which is legitimate reference reading, not a request
      # to falsify anything. The (?!not\b|never\b) guard also skips the agent's own
      # negated reassurances ("I will not misrepresent the data"). Keep this list in
      # sync with agent_factory.py's.
      patterns:
        - "\\b(?:help\\s+me|please|can\\s+you|could\\s+you|i\\s+(?:want|need)\\s+you\\s+to|go\\s+ahead\\s+and|i\\s+will|i'll|let'?s|we\\s+(?:should|will))\\s+(?:(?!not\\b|never\\b)\\w+\\s+){0,2}falsif(?:y|ication)\\b"
        - "\\b(?:help\\s+me|please|can\\s+you|could\\s+you|i\\s+(?:want|need)\\s+you\\s+to|go\\s+ahead\\s+and|i\\s+will|i'll|let'?s|we\\s+(?:should|will))\\s+(?:(?!not\\b|never\\b)\\w+\\s+){0,2}misrepresent"
        - "guaranteed\\s+(approval|coverage|payout)"
        - "cannot\\s+be\\s+denied"
