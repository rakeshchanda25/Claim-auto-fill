# Provenance for every per-state police-report layout.
#
# fidelity:
#   field-level     - field names sourced from the state's own instructions manual
#   page-level      - page/section structure sourced, box numbering NOT verified
#   form-identified - real form number and issuing agency sourced; field-level
#                     layout NOT verified, rendered from a shared archetype
#   unsourced       - no official form identified; archetype only, generic naming
#
# Most entries come from ACTAR's published table of state traffic crash report
# forms. That table lists historical revisions, so a form number here may lag the
# state's current revision - verify before relying on it for field-level work.
#
# Raising a state to field-level: obtain its form and instructions manual, record
# the fields in skills/police-report/references/states/<CODE>.md, author
# renderers/layouts/police-report/<CODE>.html, then update fidelity here.

